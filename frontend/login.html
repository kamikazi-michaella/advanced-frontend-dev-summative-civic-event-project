<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CivicEvents+ community events, announcements, and promos.">
  <title>Sign in | CivicEvents+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="min-h-screen bg-stone-50 text-stone-900">
  <main class="grid lg:min-h-screen lg:grid-cols-2">
    <section class="flex flex-col justify-between bg-emerald-900 px-6 py-10 text-white md:px-12 md:py-14">
      <a href="index.html" class="font-serif text-2xl font-bold">CivicEvents+</a>
      <div class="my-12 max-w-lg lg:my-0">
        <p class="text-sm font-semibold uppercase tracking-wide text-emerald-200">Member access</p>
        <h1 class="mt-4 font-serif text-4xl leading-tight md:text-5xl">Your community desk, ready when you are.</h1>
      </div>
      <p class="text-sm text-emerald-200">One account for events, audio notices, and promos.</p>
    </section>

    <section class="flex items-center bg-stone-50 px-5 py-10 md:px-12">
      <div class="mx-auto w-full max-w-md">
        <h2 class="font-serif text-3xl">Sign in</h2>
        <p class="mt-2 text-sm text-stone-600">Use your CivicEvents+ email and password.</p>

        <div id="login-error" class="mt-5 hidden" role="alert"></div>

        <form id="login-form" class="mt-6 space-y-5" novalidate>
          <div>
            <label for="login-email" class="mb-1.5 block text-sm font-medium text-stone-700">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="email"
              class="w-full rounded-md border border-stone-300 bg-white px-3 py-2.5 text-stone-900"
              aria-describedby="login-email-error">
            <p id="login-email-error" class="mt-1 min-h-4 text-sm text-red-700"></p>
          </div>

          <div>
            <label for="login-password" class="mb-1.5 block text-sm font-medium text-stone-700">Password</label>
            <div class="flex gap-2">
              <input id="login-password" name="password" type="password" autocomplete="current-password"
                class="w-full rounded-md border border-stone-300 bg-white px-3 py-2.5 text-stone-900"
                aria-describedby="login-password-error">
              <button id="toggle-login-password" type="button"
                class="rounded-md border border-stone-300 bg-white px-3 py-2 text-sm text-stone-700 hover:bg-stone-100">Show</button>
            </div>
            <p id="login-password-error" class="mt-1 min-h-4 text-sm text-red-700"></p>
          </div>

          <div>
            <label for="login-remember" class="flex items-start gap-2 text-sm text-stone-700">
              <input id="login-remember" type="checkbox" class="mt-1 h-4 w-4 rounded border-stone-300">
              <span>Keep me signed in on this device</span>
            </label>
            <p class="mt-1 text-xs text-stone-500">Use only on a trusted device.</p>
          </div>

          <button id="login-submit" type="submit"
            class="w-full rounded-md bg-emerald-700 px-4 py-2.5 font-medium text-white hover:bg-emerald-800 disabled:opacity-60">
            Sign in
          </button>
        </form>

        <p class="mt-6 text-sm text-stone-600">
          New here? <a href="signup.html" class="font-medium text-emerald-800 hover:underline">Create account</a>
        </p>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
